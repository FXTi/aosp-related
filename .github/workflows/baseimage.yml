name: Update docker image if its base image changed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to rebuild'
        type: choice
        options:
          - auto
          - all
          - google-repo-tool
          - git-daemon
          - ddns
        default: auto
      keepalive_days:
        description: 'Keepalive: commit when the last commit is older than this many days'
        type: number
        default: 45

jobs:
  docker-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if update available
        id: check
        uses: lucacome/docker-image-update-checker@v1
        with:
          base-image: ubuntu:latest
          image: fxti/google-repo-tool:latest

      # `auto` keeps the scheduled behaviour (rebuild only when the base image
      # moved); `all` or the image name forces a rebuild after a source change
      # such as a Dockerfile fix.
      - name: Decide whether to rebuild
        id: decide
        env:
          NEEDS_UPDATING: ${{ steps.check.outputs.needs-updating }}
          TARGET: ${{ inputs.image || 'auto' }}
        run: |
          rebuild=false
          if [ "$NEEDS_UPDATING" = "true" ]; then rebuild=true; fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "google-repo-tool" ]; then rebuild=true; fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild (needs-updating=$NEEDS_UPDATING, target=$TARGET)"

      - name: Login to DockerHub
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: sync
          push: true
          tags: fxti/google-repo-tool:latest

      - name: Feishu Notification
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          response=$(curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"msg_type":"post","content":{"post":{"zh_cn":{"title":"镜像更新通知","content":[[{"tag":"text","text":"google-repo-tool镜像已更新: "},{"tag":"a","text":"请查看","href":"https://hub.docker.com/r/fxti/google-repo-tool/tags"}]]}}}}' \
            "${{ secrets.FEISHU_BOT_WEBHOOK }}")
          echo "$response"
          code=$(jq -r '.code // .StatusCode // 0' <<< "$response")
          if [ "$code" != "0" ]; then
            echo "::error::Feishu notification failed with code $code"
            exit 1
          fi

  docker-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if update available
        id: check
        uses: lucacome/docker-image-update-checker@v1
        with:
          base-image: alpine:latest
          image: fxti/git-daemon:latest

      - name: Decide whether to rebuild
        id: decide
        env:
          NEEDS_UPDATING: ${{ steps.check.outputs.needs-updating }}
          TARGET: ${{ inputs.image || 'auto' }}
        run: |
          rebuild=false
          if [ "$NEEDS_UPDATING" = "true" ]; then rebuild=true; fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "git-daemon" ]; then rebuild=true; fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild (needs-updating=$NEEDS_UPDATING, target=$TARGET)"

      - name: Login to DockerHub
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: mirror
          push: true
          tags: fxti/git-daemon:latest

      - name: Feishu Notification
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          response=$(curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"msg_type":"post","content":{"post":{"zh_cn":{"title":"镜像更新通知","content":[[{"tag":"text","text":"git-daemon镜像已更新: "},{"tag":"a","text":"请查看","href":"https://hub.docker.com/r/fxti/git-daemon/tags"}]]}}}}' \
            "${{ secrets.FEISHU_BOT_WEBHOOK }}")
          echo "$response"
          code=$(jq -r '.code // .StatusCode // 0' <<< "$response")
          if [ "$code" != "0" ]; then
            echo "::error::Feishu notification failed with code $code"
            exit 1
          fi

  ddns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if update available
        id: check
        uses: lucacome/docker-image-update-checker@v1
        with:
          base-image: python:3-slim
          image: fxti/ddns:latest

      - name: Decide whether to rebuild
        id: decide
        env:
          NEEDS_UPDATING: ${{ steps.check.outputs.needs-updating }}
          TARGET: ${{ inputs.image || 'auto' }}
        run: |
          rebuild=false
          if [ "$NEEDS_UPDATING" = "true" ]; then rebuild=true; fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "ddns" ]; then rebuild=true; fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild (needs-updating=$NEEDS_UPDATING, target=$TARGET)"

      - name: Login to DockerHub
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ddns
          push: true
          tags: fxti/ddns:latest

      - name: Feishu Notification
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          response=$(curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"msg_type":"post","content":{"post":{"zh_cn":{"title":"镜像更新通知","content":[[{"tag":"text","text":"ddns镜像已更新: "},{"tag":"a","text":"请查看","href":"https://hub.docker.com/r/fxti/ddns/tags"}]]}}}}' \
            "${{ secrets.FEISHU_BOT_WEBHOOK }}")
          echo "$response"
          code=$(jq -r '.code // .StatusCode // 0' <<< "$response")
          if [ "$code" != "0" ]; then
            echo "::error::Feishu notification failed with code $code"
            exit 1
          fi

  keepalive:
    # In a public repository GitHub disables scheduled workflows after 60 days
    # without repository activity, and a disabled workflow cannot even be
    # dispatched manually until it is re-enabled. Commit a marker before that
    # deadline so the schedules survive quiet periods; while frp releases keep
    # the repository active this job does nothing at all.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # shared with the bump job of frp-images.yml, both of them push to master
      group: repo-commit
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit a keepalive marker when the repository is about to go stale
        env:
          # empty for scheduled runs; resolved in the shell because 0 is a valid
          # value here and `inputs.x || 45` would turn it into 45
          KEEPALIVE_DAYS_INPUT: ${{ inputs.keepalive_days }}
        run: |
          set -euo pipefail
          KEEPALIVE_DAYS="${KEEPALIVE_DAYS_INPUT:-45}"
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "last commit was $age_days days ago (threshold: $KEEPALIVE_DAYS days)"
          if [ "$age_days" -lt "$KEEPALIVE_DAYS" ]; then
            echo "repository is still active, nothing to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git add .keepalive
          if git diff --cached --quiet; then
            echo "keepalive marker unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Keep scheduled workflows enabled"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "keepalive commit pushed"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt), rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

          echo "::error::failed to push the keepalive commit after 3 attempts"
          exit 1
